[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E — ошибки pep8, F — pyflakes (опечатки/неиспользуемое), I — импорты,
# UP — современный синтаксис, B — типичные баги (bugbear)
select = ["E", "F", "I", "UP", "B"]
